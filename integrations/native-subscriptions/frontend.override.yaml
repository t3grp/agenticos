# Merge only into the existing AgenticOS application resource.
# NATIVE_SESSION_URL must identify the separate broker's scoped container, for example:
# http://agenticos-native-subscriptions-REPLACE_WITH_NATIVE_RESOURCE_UUID:8080
# Retain the existing frontend networks, settings, routes and API dependency.
services:
  agenticos-frontend:
    image: ${NATIVE_FRONTEND_IMAGE:?NATIVE_FRONTEND_IMAGE is required}
    pull_policy: never
    environment:
      NATIVE_SESSION_URL: ${NATIVE_SESSION_URL:?NATIVE_SESSION_URL is required}
      NATIVE_SESSION_SERVICE_KEY: ${NATIVE_SESSION_SERVICE_KEY:?NATIVE_SESSION_SERVICE_KEY is required}
