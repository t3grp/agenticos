# Merge with integrations/coolify-demo/compose.yml and the deployment's HTTPS routes.
services:
  agenticos-frontend:
    image: ${NATIVE_FRONTEND_IMAGE:?NATIVE_FRONTEND_IMAGE is required}
    pull_policy: never
    environment:
      NATIVE_SESSION_URL: http://agenticos-native-subscriptions:8080
      NATIVE_SESSION_SERVICE_KEY: ${NATIVE_SESSION_SERVICE_KEY:?NATIVE_SESSION_SERVICE_KEY is required}

  agenticos-native-subscriptions:
    image: ${NATIVE_SESSION_IMAGE:?NATIVE_SESSION_IMAGE is required}
    pull_policy: never
    init: true
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - KILL
      - SETGID
      - SETUID
      - SETPCAP
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
    pids_limit: 256
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=268435456,mode=1777
    environment:
      NATIVE_SESSION_SERVICE_KEY: ${NATIVE_SESSION_SERVICE_KEY:?NATIVE_SESSION_SERVICE_KEY is required}
      NATIVE_SITE_ORIGIN: ${PUBLIC_SITE_URL:?PUBLIC_SITE_URL is required}
      NATIVE_BACKEND_URL: http://agenticos-api:8000
      NATIVE_BLOCKED_CIDRS: ${NATIVE_BLOCKED_CIDRS:?NATIVE_BLOCKED_CIDRS is required}
    volumes:
      - native_subscriptions:/state
    networks:
      - edge
      - proxy
    expose:
      - "8080"
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      traefik.enable: "true"
      traefik.docker.network: coolify
      traefik.http.routers.agenticos-native.rule: Host(`${NATIVE_PUBLIC_API_HOST:?NATIVE_PUBLIC_API_HOST is required}`) && Path(`/native-subscriptions/terminal`)
      traefik.http.routers.agenticos-native.priority: "200"
      traefik.http.routers.agenticos-native.entrypoints: https
      traefik.http.routers.agenticos-native.tls: "true"
      traefik.http.routers.agenticos-native.tls.certresolver: letsencrypt
      traefik.http.routers.agenticos-native.service: agenticos-native
      traefik.http.services.agenticos-native.loadbalancer.server.port: "8080"

volumes:
  native_subscriptions: {}
